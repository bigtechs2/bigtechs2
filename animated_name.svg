<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <!-- ─── Glowing Gradient ─── -->
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff41;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00cc33;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ff41;stop-opacity:1" />
    </linearGradient>

    <!-- ─── Neon Glow Filter ─── -->
    <filter id="neon">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- ─── Stronger Neon for Title ─── -->
    <filter id="neonStrong">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- ─── Background ─── -->
  <rect width="800" height="400" fill="#0a0a0f" rx="16" />

  <!-- ─── Matrix Rain Characters (Scattered) ─── -->
  <text x="30" y="80" fill="#00ff41" opacity="0.06" font-size="18" font-family="monospace">010010</text>
  <text x="80" y="140" fill="#00ff41" opacity="0.05" font-size="14" font-family="monospace">101101</text>
  <text x="140" y="60" fill="#00ff41" opacity="0.07" font-size="20" font-family="monospace">110100</text>
  <text x="200" y="120" fill="#00ff41" opacity="0.04" font-size="16" font-family="monospace">011011</text>
  <text x="270" y="90" fill="#00ff41" opacity="0.06" font-size="22" font-family="monospace">100110</text>
  <text x="330" y="150" fill="#00ff41" opacity="0.05" font-size="14" font-family="monospace">010101</text>
  <text x="400" y="70" fill="#00ff41" opacity="0.07" font-size="18" font-family="monospace">101010</text>
  <text x="470" y="130" fill="#00ff41" opacity="0.04" font-size="20" font-family="monospace">110011</text>
  <text x="540" y="80" fill="#00ff41" opacity="0.06" font-size="16" font-family="monospace">001100</text>
  <text x="600" y="140" fill="#00ff41" opacity="0.05" font-size="14" font-family="monospace">010110</text>
  <text x="660" y="60" fill="#00ff41" opacity="0.07" font-size="22" font-family="monospace">101101</text>
  <text x="720" y="120" fill="#00ff41" opacity="0.04" font-size="18" font-family="monospace">011010</text>
  <text x="50" y="320" fill="#00ff41" opacity="0.05" font-size="16" font-family="monospace">110101</text>
  <text x="150" y="350" fill="#00ff41" opacity="0.06" font-size="14" font-family="monospace">010011</text>
  <text x="300" y="300" fill="#00ff41" opacity="0.04" font-size="20" font-family="monospace">101010</text>
  <text x="450" y="360" fill="#00ff41" opacity="0.05" font-size="18" font-family="monospace">011011</text>
  <text x="550" y="310" fill="#00ff41" opacity="0.06" font-size="16" font-family="monospace">100101</text>
  <text x="700" y="340" fill="#00ff41" opacity="0.04" font-size="22" font-family="monospace">010110</text>

  <!-- ─── GLOWING NAME ─── -->
  <text x="400" y="145" text-anchor="middle" fill="url(#glow)" filter="url(#neonStrong)" font-size="72" font-family="'Russo One', 'Courier New', sans-serif" font-weight="700" letter-spacing="6">bigtechs2</text>

  <!-- ─── SUBTITLE ─── -->
  <text x="400" y="195" text-anchor="middle" fill="#00cc33" font-size="18" font-family="'Courier New', monospace" letter-spacing="4" opacity="0.8">
    ✦ Full-Stack Developer · Creator · BIGST4CK ✦
  </text>

  <!-- ─── DIVIDER ─── -->
  <line x1="180" y1="218" x2="620" y2="218" stroke="#00ff41" stroke-width="1" opacity="0.12" />

  <!-- ─── LOCATION ─── -->
  <text x="400" y="248" text-anchor="middle" fill="#00cc33" font-size="14" font-family="monospace" letter-spacing="2" opacity="0.5">
    📍 Mbeya, Tanzania
  </text>

  <!-- ─── MOTTO ─── -->
  <text x="400" y="278" text-anchor="middle" fill="#00ff41" font-size="16" font-family="monospace" letter-spacing="4" opacity="0.35" font-style="italic">
    Code. Build. Inspire.
  </text>

  <!-- ─── TECH STACK ─── -->
  <text x="400" y="322" text-anchor="middle" fill="#00cc33" font-size="11" font-family="monospace" letter-spacing="2" opacity="0.35">
    Node.js · TypeScript · Python · MongoDB · PostgreSQL · Docker · Linux
  </text>

  <!-- ─── FOOTER ─── -->
  <text x="400" y="372" text-anchor="middle" fill="#006633" font-size="10" font-family="monospace" letter-spacing="2" opacity="0.25">
    © 2026 bigtechs2 · Built with ☕
  </text>

  <!-- ─── ANIMATED GLOW DOTS ─── -->
  <circle cx="45" cy="45" r="2.5" fill="#00ff41" opacity="0.3">
    <animate attributeName="opacity" values="0.1;0.6;0.1" dur="3s" repeatCount="indefinite" />
    <animate attributeName="r" values="2;3.5;2" dur="3s" repeatCount="indefinite" />
  </circle>

  <circle cx="755" cy="45" r="2.5" fill="#00ff41" opacity="0.3">
    <animate attributeName="opacity" values="0.1;0.6;0.1" dur="4s" repeatCount="indefinite" />
    <animate attributeName="r" values="2;3.5;2" dur="4s" repeatCount="indefinite" />
  </circle>

  <circle cx="45" cy="355" r="2.5" fill="#00ff41" opacity="0.3">
    <animate attributeName="opacity" values="0.1;0.6;0.1" dur="5s" repeatCount="indefinite" />
    <animate attributeName="r" values="2;3.5;2" dur="5s" repeatCount="indefinite" />
  </circle>

  <circle cx="755" cy="355" r="2.5" fill="#00ff41" opacity="0.3">
    <animate attributeName="opacity" values="0.1;0.6;0.1" dur="2.5s" repeatCount="indefinite" />
    <animate attributeName="r" values="2;3.5;2" dur="2.5s" repeatCount="indefinite" />
  </circle>

  <!-- ─── FLOATING MATRIX BITS ─── -->
  <text x="60" y="200" fill="#00ff41" opacity="0.04" font-size="10" font-family="monospace">
    <animate attributeName="opacity" values="0.02;0.06;0.02" dur="6s" repeatCount="indefinite" />
    0110
  </text>
  <text x="710" y="230" fill="#00ff41" opacity="0.04" font-size="10" font-family="monospace">
    <animate attributeName="opacity" values="0.02;0.06;0.02" dur="7s" repeatCount="indefinite" />
    1001
  </text>
</svg>