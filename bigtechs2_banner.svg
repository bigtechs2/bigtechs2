<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff41;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00cc33;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ff41;stop-opacity:1" />
    </linearGradient>
    <filter id="neon">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="#0a0a0f" rx="20" />

  <!-- Matrix Rain Characters (scattered) -->
  <text x="50" y="100" fill="#00ff41" opacity="0.08" font-size="20" font-family="monospace">101101</text>
  <text x="150" y="60" fill="#00ff41" opacity="0.06" font-size="16" font-family="monospace">010010</text>
  <text x="300" y="120" fill="#00ff41" opacity="0.07" font-size="18" font-family="monospace">110100</text>
  <text x="500" y="80" fill="#00ff41" opacity="0.05" font-size="14" font-family="monospace">011011</text>
  <text x="650" y="140" fill="#00ff41" opacity="0.06" font-size="22" font-family="monospace">100110</text>
  <text x="100" y="320" fill="#00ff41" opacity="0.07" font-size="17" font-family="monospace">010101</text>
  <text x="400" y="350" fill="#00ff41" opacity="0.05" font-size="19" font-family="monospace">101010</text>
  <text x="700" y="300" fill="#00ff41" opacity="0.06" font-size="15" font-family="monospace">110011</text>

  <!-- Glowing Name -->
  <text x="400" y="140" text-anchor="middle" fill="url(#glow)" filter="url(#neon)" font-size="70" font-family="'Russo One', 'Courier New', sans-serif" font-weight="700" letter-spacing="6">bigtechs2</text>

  <!-- Subtitle -->
  <text x="400" y="190" text-anchor="middle" fill="#00cc33" font-size="18" font-family="'Courier New', monospace" letter-spacing="4" opacity="0.8">✦ Full-Stack Developer · Creator · BIGST4CK ✦</text>

  <!-- Divider -->
  <line x1="200" y1="215" x2="600" y2="215" stroke="#00ff41" stroke-width="1" opacity="0.15" />

  <!-- Location -->
  <text x="400" y="245" text-anchor="middle" fill="#00cc33" font-size="14" font-family="monospace" letter-spacing="2" opacity="0.6">📍 Mbeya, Tanzania</text>

  <!-- Motto -->
  <text x="400" y="275" text-anchor="middle" fill="#00ff41" font-size="16" font-family="monospace" letter-spacing="4" opacity="0.4" font-style="italic">Code. Build. Inspire.</text>

  <!-- Tech Stack Row -->
  <text x="400" y="320" text-anchor="middle" fill="#00cc33" font-size="12" font-family="monospace" letter-spacing="3" opacity="0.4">Node.js · TypeScript · Python · MongoDB · PostgreSQL · Docker · Linux</text>

  <!-- Footer -->
  <text x="400" y="370" text-anchor="middle" fill="#006633" font-size="10" font-family="monospace" letter-spacing="2" opacity="0.3">© 2026 bigtechs2 · Built with ☕</text>

  <!-- Small glowing dots -->
  <circle cx="50" cy="50" r="2" fill="#00ff41" opacity="0.3">
    <animate attributeName="opacity" values="0.1;0.5;0.1" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="750" cy="50" r="2" fill="#00ff41" opacity="0.3">
    <animate attributeName="opacity" values="0.1;0.5;0.1" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50" cy="350" r="2" fill="#00ff41" opacity="0.3">
    <animate attributeName="opacity" values="0.1;0.5;0.1" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="750" cy="350" r="2" fill="#00ff41" opacity="0.3">
    <animate attributeName="opacity" values="0.1;0.5;0.1" dur="2.5s" repeatCount="indefinite"/>
  </circle>
</svg>